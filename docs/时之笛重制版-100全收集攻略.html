<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时之笛 重制版 · 100% 全收集攻略</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>

    --text:#ece3d0; --muted:#b3a37f;

    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.55; min-height:100vh;
    background-image:radial-gradient(1200px 600px at 80% -10%, rgba(212,175,55,.10), transparent 60%);
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}

  /* ===== 顶部 ===== */
  header.top{
    position:sticky;top:0;z-index:30;
    background:rgba(23,18,10,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .top-inner{max-width:1180px;margin:0 auto;padding:14px 16px}
  .title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .title-row h1{font-size:18px;font-weight:900;color:var(--gold2);letter-spacing:.5px}
  .title-row .sub{font-size:12px;color:var(--muted)}
  .spacer{flex:1}
  .btn{
    border:1px solid var(--line);background:var(--card2);color:var(--text);
    border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold2)}
  .progress-head{margin-top:10px}
  .progress-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
  .progress-meta b{color:var(--gold2)}
  .bar{height:10px;border-radius:99px;background:#0f0c06;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6d1f,var(--gold),var(--gold2));border-radius:99px;transition:width .3s}

  /* ===== 工具栏 ===== */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
  .toolbar label{font-size:12px;color:var(--muted)}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:var(--card);color:var(--muted);border:0;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--card2);color:var(--gold2);font-weight:700}
  input[type=search],select{
    background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:8px 10px;font-size:13px;font-family:inherit;min-width:150px;
  }
  input[type=search]{flex:1;min-width:160px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;
  }
  .chip.on{background:var(--card2);border-color:var(--gold);color:var(--gold2)}

  /* ===== 分类节 ===== */
  section.cat{margin-top:26px}
  .cat-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .cat-head .icon{font-size:18px}
  .cat-head h2{font-size:16px;font-weight:700;color:var(--gold2)}
  .cat-head .count{font-size:12px;color:var(--muted)}
  .cat-head .cat-bar{flex:1;min-width:80px;height:6px;border-radius:99px;background:#0f0c06;border:1px solid var(--line);overflow:hidden}
  .cat-head .cat-bar i{display:block;height:100%;background:var(--gold);width:0}

  /* ===== 卡片网格 ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;display:flex;gap:12px;transition:border-color .15s;
  }
  .card:hover{border-color:#7a5f2c}
  .card.done{opacity:.55}
  .check{
    flex:0 0 22px;width:22px;height:22px;margin-top:2px;cursor:pointer;
    border:2px solid var(--line);border-radius:7px;background:#0f0c06;display:grid;place-items:center;
    color:var(--gold2);font-size:14px;user-select:none;
  }
  .card.done .check{background:var(--gold);border-color:var(--gold);color:#17120a}
  .card-body{flex:1;min-width:0}
  .card-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .no{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .name{font-size:14px;font-weight:700;color:var(--text)}
  .card.done .name{text-decoration:line-through}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
  .tag{font-size:11px;border-radius:6px;padding:2px 7px;border:1px solid var(--line)}
  .tag.age-child{color:var(--child);border-color:#3f6b3f}
  .tag.age-adult{color:var(--adult);border-color:#3f5f7a}
  .tag.age-either{color:var(--either);border-color:#7a6428}
  .tag.time-night{color:var(--night);border-color:#5f4775}
  .tag.region{color:var(--muted)}
  .desc{font-size:12.5px;color:var(--muted);margin-top:4px}
  .desc b{color:var(--text);font-weight:500}
  .reward{font-size:12px;color:var(--gold2);margin-top:6px}
  .prereq{font-size:11.5px;color:#c9b98f;margin-top:4px}

  /* 占位卡 */
  .placeholder{
    border:1px dashed var(--line);border-radius:var(--radius);padding:18px 16px;
    color:var(--muted);font-size:13px;background:rgba(43,33,21,.5)
  }
  .placeholder h3{color:var(--gold2);font-size:14px;margin-bottom:6px}
  .placeholder ul{margin:8px 0 0 18px;font-size:12.5px}
  .placeholder li{margin:3px 0}

  .empty{padding:40px 0;text-align:center;color:var(--muted);font-size:14px}
  footer{margin-top:40px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}

  @media (max-width:640px){
    .grid{grid-template-columns:1fr}
    .title-row h1{font-size:16px}
    input[type=search]{min-width:100%}
  }
</style>
</head>

<header class="top">

      <h1>🗡️ 时之笛 重制版 · 100% 全收集攻略</h1>

    </div>
    <div class="progress-head">
      <div class="progress-meta">
        <span>总完成度（已实装条目）</span>
        <span><b id="doneCount">0</b> / <span id="totalCount">0</span></span>
      </div>
      <div class="bar"><i id="totalBar"></i></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">

    <input type="search" id="search" placeholder="搜索名称 / 地点 / 前置道具…">
    <select id="regionFilter"><option value="">全部地区</option></select>
  </div>
  <div class="toolbar">
    <span style="font-size:12px;color:var(--muted)">时期</span>
    <div class="chips" id="ageChips">
      <button class="chip on" data-age="">不限</button>
      <button class="chip" data-age="child">幼年林克</button>
      <button class="chip" data-age="adult">成年林克</button>
      <button class="chip" data-age="either">均可</button>
    </div>
    <span style="font-size:12px;color:var(--muted)">昼夜</span>
    <div class="chips" id="timeChips">
      <button class="chip on" data-time="">不限</button>
      <button class="chip" data-time="night">仅夜晚</button>
      <button class="chip" data-time="day">白天/不限</button>
    </div>
  </div>

  <main id="list"></main>

  <footer>
    说明：游戏本身无完成度百分比，本清单按「能留在身上的物品」自定 100% 目标。

    每条预留地图坐标字段（x/y），后续合并到地图时直接填入即可。
  </footer>
</div>

/* ==================== 逻辑层 ==================== */
const STORE_KEY = 'oot-100-checklist-v1';
const state = {
  view:'category',
  search:'',
  region:'',
  age:'',
  time:'',
  checked: loadChecked(),
};

function loadChecked(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveChecked(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state.checked));
}

const catMap = Object.fromEntries(CATEGORIES.map(c=>[c.id,c]));
const regions = [...new Set(ITEMS.map(i=>i.region))].sort();

function ageLabel(a){ return a==='child'?'幼年':a==='adult'?'成年':'均可'; }
function timeLabel(t){ return t==='night'?'夜晚':t==='day'?'白天':'不限'; }

function matchItem(it){
  if(state.age && it.age!==state.age) return false;
  if(state.time==='night' && it.time!=='night') return false;
  if(state.time==='day' && it.time==='night') return false;
  if(state.region && it.region!==state.region) return false;
  if(state.search){
    const q = state.search.toLowerCase();
    const hay = [it.name,it.region,it.desc,it.prereq||''].join(' ').toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function filtered(){ return ITEMS.filter(matchItem); }

function render(){
  const list = filtered();
  const main = document.getElementById('list');

  // 地区下拉
  const regionSel = document.getElementById('regionFilter');
  if(regionSel.options.length <= 1){
    regions.forEach(r=>{
      const o=document.createElement('option'); o.value=r; o.textContent=r; regionSel.appendChild(o);
    });
  }

  // 总进度（仅实装条目）
  const active = ITEMS;
  const done = active.filter(i=>state.checked[i.id]).length;
  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = active.length;
  document.getElementById('totalBar').style.width = (active.length? done/active.length*100:0)+'%';

  if(list.length===0){
    main.innerHTML = '<div class="empty">没有符合筛选条件的收集物</div>';
    return;
  }

  let html = '';
  if(state.view==='category'){
    CATEGORIES.forEach(cat=>{
      const items = list.filter(i=>i.cat===cat.id);
      if(cat.pending){
        html += `<section class="cat">
          <div class="cat-head"><span class="icon">${cat.icon}</span><h2>${cat.name}</h2>
          <span class="count">目标 ${cat.total} 项</span></div>
          <div class="placeholder">
            <h3>📍 逐条点位整理中（${cat.total}）</h3>
            <div>${cat.note}</div>
            <ul>
              <li>点位将按「幼年/成年、昼夜、前置道具、地区」逐条录入</li>
              <li>录入后自动进入上方进度统计与筛选</li>
            </ul>
          </div>
        </section>`;
        return;
      }
      if(items.length===0) return;
      const cDone = items.filter(i=>state.checked[i.id]).length;
      html += `<section class="cat">
        <div class="cat-head">
          <span class="icon">${cat.icon}</span><h2>${cat.name}</h2>
          <span class="count">${cDone}/${items.length}</span>
          <div class="cat-bar"><i style="width:${items.length?cDone/items.length*100:0}%"></i></div>
        </div>
        <div class="grid">${items.map(cardHtml).join('')}</div>
      </section>`;
    });
  } else {
    const byRegion = {};
    list.forEach(i=>{ (byRegion[i.region]=byRegion[i.region]||[]).push(i); });
    Object.keys(byRegion).sort().forEach(r=>{
      const items = byRegion[r];
      const cDone = items.filter(i=>state.checked[i.id]).length;
      html += `<section class="cat">
        <div class="cat-head"><h2>${r}</h2><span class="count">${cDone}/${items.length}</span></div>
        <div class="grid">${items.map(cardHtml).join('')}</div>
      </section>`;
    });
  }
  main.innerHTML = html;
}

function cardHtml(it){
  const isDone = !!state.checked[it.id];
  const tags = [
    `<span class="tag age-${it.age}">${ageLabel(it.age)}</span>`,
    it.time==='night' ? `<span class="tag time-night">夜晚</span>` : '',
    `<span class="tag region">${catMap[it.cat].name}</span>`,
  ].join('');
  const prereq = it.prereq ? `<div class="prereq">前置：${it.prereq}</div>` : '';
  const reward = it.reward ? `<div class="reward">🎁 ${it.reward}</div>` : '';
  return `<div class="card ${isDone?'done':''}" data-id="${it.id}">
    <div class="check" role="checkbox" aria-checked="${isDone}">${isDone?'✔':''}</div>
    <div class="card-body">
      <div class="card-top"><span class="no">#${it.no}</span><span class="name">${it.name}</span></div>
      <div class="tags">${tags}</div>
      <div class="desc">${it.desc}</div>
      ${prereq}${reward}
    </div>
  </div>`;
}

/* 事件绑定 */
document.getElementById('viewSeg').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  state.view = btn.dataset.view;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle('on', b===btn));
  render();
});
document.getElementById('search').addEventListener('input', e=>{ state.search=e.target.value; render(); });
document.getElementById('regionFilter').addEventListener('change', e=>{ state.region=e.target.value; render(); });
document.getElementById('ageChips').addEventListener('click', e=>{
  const btn=e.target.closest('.chip'); if(!btn) return;
  state.age=btn.dataset.age;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b===btn));
  render();
});
document.getElementById('timeChips').addEventListener('click', e=>{
  const btn=e.target.closest('.chip'); if(!btn) return;
  state.time=btn.dataset.time;
  [...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b===btn));
  render();
});
document.getElementById('list').addEventListener('click', e=>{
  const card = e.target.closest('.card'); if(!card) return;
  const id = card.dataset.id;
  state.checked[id] = !state.checked[id];
  if(!state.checked[id]) delete state.checked[id];
  saveChecked(); render();
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('确定清空全部勾选记录？')){ state.checked={}; saveChecked(); render(); }
});

render();
</script>
</body>
</html>
